  <g transform="translate(35, 310)">
    <rect width="770" height="120" fill="#0d140e" stroke="#193D2B" stroke-width="1"/>
    <text x="20" y="24" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#A5F36B" font-weight="600">> TELEMETRY MONITOR &amp; COMPLIANCE AUDITING STREAM</text>
    <line x1="20" y1="34" x2="750" y2="34" stroke="#193D2B" stroke-width="1"/>

    <g transform="translate(20, 46)">
      <rect width="230" height="60" fill="#101310" stroke="#193D2B"/>
      <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#D49A54">AUDIT LOG: #8092-A</text>
      <text x="10" y="34" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#E8E3D5">Unsanitized token detected</text>
      <text x="10" y="48" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#75463F">ACTION: DISTILLED &amp; REPORTED</text>
    </g>

    <g transform="translate(270, 46)">
      <rect width="230" height="60" fill="#101310" stroke="#193D2B"/>
      <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#D49A54">POLICY ENGINE: REV 1.4</text>
      <text x="10" y="34" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#E8E3D5">Anomaly detection routine</text>
      <text x="10" y="48" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#A5F36B">STATUS: ACTIVE IN-PROGRESS</text>
    </g>

    <g transform="translate(520, 46)">
      <rect width="230" height="60" fill="#101310" stroke="#193D2B"/>
      <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#D49A54">SECURITY ARCHITECTURE</text>
      <text x="10" y="34" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#E8E3D5">Zero-Trust perimeter gate</text>
      <text x="10" y="48" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#E8E3D5">Pre-Final Year Research Scope</text>
    </g>
