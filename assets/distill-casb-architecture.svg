    <text x="10" y="44" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">> AWS / Cloud Infra</text>
    <text x="10" y="62" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">> SaaS Collaborative</text>
    <text x="10" y="80" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">> Enterprise Databases</text>
    <text x="10" y="105" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#A5F36B">Sanitized Ingestion</text>
    <text x="10" y="125" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#6c8071">Secure API Hooks</text>
  </g>

