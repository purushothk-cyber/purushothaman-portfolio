<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="grid-bank" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#193D2B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A5F36B"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#D49A54"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#101310"/>
  <rect width="800" height="450" fill="url(#grid-bank)"/>

  <!-- Border & Technical Header -->
  <rect x="15" y="15" width="770" height="420" fill="none" stroke="#193D2B" stroke-width="1.5"/>
  <rect x="15" y="15" width="770" height="28" fill="#193D2B" fill-opacity="0.35"/>
  <text x="25" y="34" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#A5F36B" font-weight="600" letter-spacing="1">FIG 02.1 // OOP CLASS HIERARCHY &amp; CONSOLE PIPELINE: BANK SYSTEM</text>
  <text x="710" y="34" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#D49A54">RUNTIME: JVM</text>

  <!-- Class 1: BankApp / Main Controller -->
  <g transform="translate(40, 70)">
    <rect width="210" height="150" fill="#131a14" stroke="#A5F36B" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="26" fill="#193D2B"/>
    <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#A5F36B" font-weight="700">CLASS: BankController</text>
    <text x="10" y="45" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">- Scanner inputScanner</text>
    <text x="10" y="60" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">- Map&lt;Long, Account&gt; accounts</text>
    <line x1="0" y1="70" x2="210" y2="70" stroke="#193D2B" stroke-width="1"/>
    <text x="10" y="88" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ main(String[] args): void</text>
    <text x="10" y="104" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ displayMenu(): void</text>
    <text x="10" y="120" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ routeOperation(int code): void</text>
    <text x="10" y="138" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#6c8071">// CLI Event Loop Handler</text>
  </g>

  <!-- Class 2: Account Entity -->
  <g transform="translate(310, 70)">
    <rect width="230" height="175" fill="#131a14" stroke="#D49A54" stroke-width="1.2"/>
    <rect x="0" y="0" width="230" height="26" fill="#75463F" fill-opacity="0.35"/>
    <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#D49A54" font-weight="700">CLASS: BankAccount [Entity]</text>
    <text x="10" y="45" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">- accountNumber: long</text>
    <text x="10" y="60" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">- accountHolder: String</text>
    <text x="10" y="75" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">- currentBalance: double</text>
    <line x1="0" y1="85" x2="230" y2="85" stroke="#193D2B" stroke-width="1"/>
    <text x="10" y="103" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ deposit(double amt): boolean</text>
    <text x="10" y="119" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ withdraw(double amt): boolean</text>
    <text x="10" y="135" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ getBalance(): double</text>
    <text x="10" y="151" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#E8E3D5">+ printAccountSummary(): void</text>
    <text x="10" y="168" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#A5F36B">// Encapsulated state &amp; guards</text>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 250 145 L 302 145" fill="none" stroke="#A5F36B" stroke-width="1.5" marker-end="url(#arrow-g)"/>

  <!-- Class 3: Terminal UI Interaction Output -->
  <g transform="translate(580, 70)">
    <rect width="180" height="150" fill="#0c120d" stroke="#193D2B" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="24" fill="#193D2B" fill-opacity="0.6"/>
    <text x="8" y="16" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#A5F36B" font-weight="600">STDOUT CLI CONSOLE</text>
    <text x="8" y="42" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#D49A54">=== BANK OPS v1.0 ===</text>
    <text x="8" y="58" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">1. Deposit Funds</text>
    <text x="8" y="74" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">2. Withdraw Cash</text>
    <text x="8" y="90" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">3. Balance Enquiry</text>
    <text x="8" y="106" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">4. Exit Session</text>
    <text x="8" y="128" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#A5F36B">> Enter choice: _</text>
  </g>

  <path d="M 540 145 L 572 145" fill="none" stroke="#D49A54" stroke-width="1.5" marker-end="url(#arrow-o)"/>

  <!-- Lower Section: Validation & Exception Handling Matrix -->
  <g transform="translate(40, 270)">
    <rect width="720" height="135" fill="#0d140e" stroke="#193D2B" stroke-width="1"/>
    <text x="18" y="22" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#A5F36B" font-weight="600">> SECURITY &amp; INTEGRITY CONSTRAINTS (OOP ENCAPSULATION)</text>
    <line x1="18" y1="32" x2="702" y2="32" stroke="#193D2B" stroke-width="1"/>

    <!-- Spec 1 -->
    <g transform="translate(18, 45)">
      <rect width="215" height="72" fill="#101310" stroke="#193D2B"/>
      <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">[CONSTRAINT 01]</text>
      <text x="10" y="36" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">Negative Amount Rejection</text>
      <text x="10" y="54" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#6c8071">Prevents arbitrary credit injects</text>
    </g>

    <!-- Spec 2 -->
    <g transform="translate(252, 45)">
      <rect width="215" height="72" fill="#101310" stroke="#193D2B"/>
      <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">[CONSTRAINT 02]</text>
      <text x="10" y="36" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">Overdraft Guard Logic</text>
      <text x="10" y="54" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#6c8071">Withdrawal &lt;= Available Balance</text>
    </g>

    <!-- Spec 3 -->
    <g transform="translate(486, 45)">
      <rect width="215" height="72" fill="#101310" stroke="#193D2B"/>
      <text x="10" y="18" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#D49A54">[CONSTRAINT 03]</text>
      <text x="10" y="36" font-family="'IBM Plex Mono', monospace" font-size="8.5" fill="#E8E3D5">State Isolation</text>
      <text x="10" y="54" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#6c8071">Private properties + strict getters</text>
    </g>
  </g>
</svg>